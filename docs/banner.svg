<text x="270" y="150" fill="#9fb4ba" font-size="26" font-weight="600">a signed receipt that the seal held</text>
<text x="56" y="196" fill="#9fb4ba" font-size="20">A benchmark score is a claim. <tspan fill="#63e0cf">bulla</tspan> makes it a receipt — proof that the network was</text>
